[package]
name = "editor-91to9"
version = "0.1.1"
edition = "2024"
description = "Explorer TUI + GUI that lists files/folders with size stats; code and image editing are planned"
license = "GPL-3.0"
authors = ["PNMnasa <maingocphong216@gmail.com>"]
rust-version = "1.95"
repository = "https://github.com/PNMnasa/editor"

[features]
# Build modes: `tui` (default), `gui`, or `full` (both).
default = ["full"]
full = ["gui", "tui"]
gui = ["dep:eframe"]
tui = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
# `glow` renderer instead of the default `wgpu` backend: wgpu's Windows stack is
# currently broken by a windows-core 0.61/0.62 version clash (E0308 in wgpu-hal).
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }

[[bench]]
name = "scan"
harness = false
