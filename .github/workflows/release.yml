name: Release build

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        shell: bash
        run: |
          version=$(awk '
            /^\[package\]/ { p=1; next }
            /^\[/ { p=0 }
            p && /^version = "/ {
              line=$0
              sub(/^version = "/, "", line)
              sub(/".*/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          echo "version=$version" >> "$GITHUB_ENV"
          expected="v$version"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match Cargo.toml version (expected $expected)" >&2
            exit 1
          fi

      - name: Release notes must exist in CHANGELOG
        shell: bash
        run: |
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::There is no '## [$version]' section in CHANGELOG.md for this release" >&2
            exit 1
          fi
          awk -v v="$version" '
            BEGIN { section = "## [" v "]" }
            index($0, section) == 1 { cap=1; next }
            cap && substr($0, 1, 3) == "## " { exit }
            cap { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            binary: editor-91to9
            artifact: editor-linux
          - os: windows-latest
            binary: editor-91to9.exe
            artifact: editor-windows.exe
          - os: macos-latest
            binary: editor-91to9
            artifact: editor-macos

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: artifacts/release-notes/RELEASE_NOTES.md